<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-/cDfmVEB+C4kgV+JQTMA0mbNTSnn9tLcfLRH+5CRYng=' 'sha256-e5GO7v9kLfG/JNgUswPH5arzxFhzkdS30M/2otUiuP0=' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://raw.githubusercontent.com https://media.githubusercontent.com https://*.githubusercontent.com https://gitlab.com; media-src blob:; connect-src https://api.github.com https://raw.githubusercontent.com https://media.githubusercontent.com https://*.githubusercontent.com https://gitlab.com https://cdn.jsdelivr.net blob: data:; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'none'">
<meta name="referrer" content="no-referrer">
<title>عارض مشاريع Unity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#191b1f; --panel:#22252b; --panel2:#2a2e35; --line:#353a43;
  --ink:#e8eaee; --dim:#9aa1ad; --accent:#4c9bff; --accent2:#ffb84c; --bad:#ff6b6b; --good:#5ad18a;
  color-scheme:dark;
}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans Arabic",system-ui,sans-serif;display:flex;flex-direction:column;overflow-x:clip}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
header{display:flex;gap:8px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:17px;margin:0;margin-inline-end:6px;white-space:nowrap}
form{display:flex;gap:8px;flex:1 1 380px}
#url{flex:1;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:16px;direction:ltr;text-align:left}
#url:focus,#q:focus{outline:2px solid var(--accent);outline-offset:1px}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:#4a505b}
.btn:disabled{opacity:.55;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#06121f;font-weight:700}
.btn.icon{padding:0;width:44px;font-size:19px}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible{outline:2px solid var(--accent2);outline-offset:1px}
.btn.on{border-color:var(--accent);color:var(--accent)}
#star.on{color:var(--accent2);border-color:var(--accent2)}
.hgroup{display:flex;gap:8px;align-items:center}
/* dropdowns */
.dd{position:relative}
.dd>summary{list-style:none}
.dd>summary::-webkit-details-marker{display:none}
.menu{position:absolute;top:calc(100% + 6px);inset-inline-end:0;z-index:20;min-width:240px;max-width:min(380px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 12px 32px #000a}
.menu .mi{display:flex;align-items:center;gap:6px;width:100%;min-height:42px;padding:0 10px;border:0;border-radius:8px;background:none;cursor:pointer;text-align:start}
.menu .mi:hover{background:var(--panel2)}
.menu .mi bdi{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:start}
.menu .x{border:0;background:none;color:var(--dim);cursor:pointer;width:36px;height:36px;border-radius:8px;font-size:16px}
.menu .x:hover{color:var(--bad);background:var(--panel2)}
.menu .empty{padding:12px;font-size:13px}
main{flex:1;display:grid;grid-template-columns:420px minmax(0,1fr);min-height:0}
main>aside{order:-1}
/* viewer */
#viewer{position:relative;background:radial-gradient(ellipse at 50% 35%,#2d323b,#15171a 75%);min-height:300px;overflow:hidden}
#viewer canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#imgview{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:64px 20px 56px;background:repeating-conic-gradient(#2a2e35 0 25%,#22252b 0 50%) 0 0/24px 24px}
#imgview img{max-width:100%;max-height:100%;box-shadow:0 8px 30px #0008}
#audview{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:20px}
.audcard{width:min(460px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;text-align:center}
.audcard .ico{font-size:40px;line-height:1;margin-bottom:8px;color:#ff9dbf}
.audcard b{display:block;direction:ltr;overflow-wrap:anywhere;margin-bottom:14px}
.audcard audio{width:100%}
#textview{position:absolute;inset:58px 10px 56px;display:none;overflow:auto;background:#15171a;border:1px solid var(--line);border-radius:10px;direction:ltr;text-align:left;font:12.5px/1.55 ui-monospace,Consolas,monospace;z-index:1}
#textview .ln{display:flex;white-space:pre;min-height:1.55em}
#textview .ln::before{content:attr(data-n);flex:none;width:52px;padding-right:10px;text-align:right;color:#5d6470;user-select:none}
#textview .ln.hit{background:#ffb84c2e}
#textview .more{padding:8px 12px;color:var(--dim);font-family:inherit}
#msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--dim);pointer-events:none}
#msg b{color:var(--ink);font-size:18px;display:block;margin-bottom:6px;overflow-wrap:anywhere}
#msg a{pointer-events:auto;color:var(--accent)}
.tools{position:absolute;top:10px;inset-inline-start:10px;inset-inline-end:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none;z-index:3}
.tools .btn{pointer-events:auto;min-height:38px;padding:0 11px;background:#22252bd9;backdrop-filter:blur(6px);font-size:14px}
.tools .btn i{font-style:normal;font-size:15px}
.tools .sep{flex:1}
.tools.no3d .only3d{display:none}
#dims{position:absolute;top:58px;inset-inline-start:10px;background:#22252be6;border:1px solid var(--accent2);color:var(--accent2);border-radius:8px;padding:4px 10px;font-size:13px;direction:ltr;z-index:2}
#info{position:absolute;bottom:10px;inset-inline-start:10px;inset-inline-end:10px;background:#22252bd9;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--dim);z-index:2;overflow-wrap:anywhere}
#info b{color:var(--ink)}
/* progress bar */
#xfer{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:58;width:min(440px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px 12px;box-shadow:0 12px 32px #000a}
#xfer .xh{display:flex;gap:12px;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:7px}
#xferLabel{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#xferNum{color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums}
.xbar{position:relative;height:8px;border-radius:4px;background:#ffffff14;overflow:hidden;direction:ltr}
.xbar i{display:block;height:100%;width:0;background:var(--accent);border-radius:4px;transition:width .15s linear}
.xbar.ind i{width:35%;animation:xind 1.1s linear infinite}
@keyframes xind{from{transform:translateX(-100%)}to{transform:translateX(290%)}}
#xfer.done .xbar i{background:var(--good)}
#xfer.done #xferLabel{color:var(--good);font-weight:600}
/* connection */
#netfail{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:61;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;background:var(--panel);border:1px solid var(--bad);border-radius:12px;padding:10px 14px;box-shadow:0 12px 32px #000a;max-width:calc(100vw - 24px)}
#netfail span{font-size:14px}
#netfail .btn{min-height:38px;padding:0 12px;font-size:14px}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:62;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:14px;box-shadow:0 8px 24px #0008}
@media(prefers-reduced-motion:reduce){.xbar.ind i{animation:none;width:100%;opacity:.5}}
/* stall banner */
#stall{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;background:var(--panel);border:1px solid var(--accent2);border-radius:12px;padding:10px 14px;box-shadow:0 12px 32px #000a;max-width:calc(100vw - 24px)}
#stall span{font-size:14px}
#stall .btn{min-height:38px;padding:0 12px;font-size:14px}
/* animations */
#anim{position:absolute;bottom:58px;inset-inline-start:10px;width:min(320px,calc(100% - 20px));background:#22252bf0;border:1px solid var(--line);border-radius:10px;padding:8px;z-index:2;font-size:13px}
#anim .ah{display:flex;align-items:center;gap:8px;margin-bottom:6px}
#anim .ah b{flex:1}
#anim .ah .btn{min-height:34px;padding:0 10px;font-size:13px}
#clips{max-height:132px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.clip{display:flex;gap:8px;align-items:center;width:100%;min-height:32px;padding:0 8px;border:0;border-radius:6px;background:none;cursor:pointer;text-align:start}
.clip:hover{background:var(--panel2)}
.clip.on{background:#4c9bff2e;color:var(--accent)}
.clip bdi{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:start}
.clip small{color:var(--dim);direction:ltr}
.speed{display:flex;align-items:center;gap:8px;margin-top:6px;color:var(--dim)}
.speed input{flex:1;accent-color:var(--accent)}
.speed output{min-width:38px;text-align:end;direction:ltr;color:var(--ink)}
/* hierarchy */
#hier{position:absolute;top:58px;inset-inline-end:10px;width:min(300px,calc(100% - 20px));max-height:calc(100% - 120px);display:flex;flex-direction:column;background:#22252bf0;border:1px solid var(--line);border-radius:10px;overflow:hidden;z-index:2}
.hhead{padding:8px 12px;font-weight:700;font-size:13px;border-bottom:1px solid var(--line)}
.hhead small{display:block;font-weight:400;color:var(--dim);font-size:11px}
#htree{overflow:auto;padding:4px 0;font-size:13px;direction:ltr;text-align:left}
#htree details{padding-left:12px}
#htree>details,#htree>.hl{padding-left:4px}
#htree .hl{padding-left:24px}
#htree summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:2px}
#htree summary::before{content:"▸";color:var(--dim);width:12px;flex:none;font-size:11px}
#htree details[open]>summary::before{content:"▾"}
#htree summary::-webkit-details-marker{display:none}
.hn{display:block;flex:1;border:0;background:none;padding:3px 6px;border-radius:5px;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:28px}
.hn:hover{background:var(--panel2)}
.hn small{color:var(--dim);font-size:11px;margin-left:6px}
.hn.pf bdi{color:#7fb8ff}.hn.md bdi{color:#9fd4ff}.hn.miss bdi{color:var(--bad)}.hn.off{opacity:.5}
.hn.sel{background:#4c9bff33;outline:1px solid var(--accent)}
.hn:focus-visible{outline:2px solid var(--accent)}
/* drop overlay */
#drop{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:#0d1a2bcc;border:3px dashed var(--accent);font-size:22px;font-weight:700;pointer-events:none}
/* list side */
aside{display:flex;flex-direction:column;background:var(--panel);border-inline-end:1px solid var(--line);min-height:0}
.ahead{display:flex;align-items:center;gap:8px;padding:10px 14px 4px}
#repoTitle{flex:1;font-weight:700;direction:ltr;text-align:right;overflow-wrap:anywhere}
html[dir=ltr] #repoTitle{text-align:left}
.ahead .btn{min-height:36px;padding:0 10px;font-size:13px}
#note{padding:0 14px;font-size:13px;color:var(--accent2)}
#susWarn{margin:6px 14px 0;display:flex;align-items:center;gap:8px;width:calc(100% - 28px);min-height:36px;padding:4px 10px;border:1px solid #ff6b6b80;border-radius:8px;background:#ff6b6b14;color:#ffb1b1;font-size:13px;cursor:pointer;text-align:start}
#susWarn.on{outline:2px solid var(--bad)}
.search{padding:8px 14px 0}
#q{width:100%;min-height:42px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:15px}
.filters{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
.chip{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:14px;white-space:nowrap}
.chip span{color:var(--dim);margin-inline-start:4px;font-size:12px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#06121f;font-weight:600}
.chip.on span{color:#06121fb0}
.opts{display:flex;align-items:center;gap:14px;padding:6px 14px;font-size:13px;color:var(--dim);border-bottom:1px solid var(--line);flex-wrap:wrap}
.opts label{display:flex;align-items:center;gap:8px;min-height:32px;cursor:pointer}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none;margin:0;cursor:pointer}
#list{flex:1;overflow-y:auto;min-height:0}
.row{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;border-bottom:1px solid #2c3037;padding-inline-start:14px}
.row:hover{background:var(--panel2)}
.row.sel{background:#4c9bff22;box-shadow:inset -3px 0 var(--accent)}
html[dir=ltr] .row.sel{box-shadow:inset 3px 0 var(--accent)}
.row.bad .nm b{color:#ffb1b1}
.row.bad .th{outline:1px solid var(--bad)}
.rowmain{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:7px 14px;border:0;background:none;text-align:start;cursor:pointer;min-height:56px}
.rowmain:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
/* thumbnail box: fixed 48×48, image centred and fully visible (contain), never overflows the row */
.th{position:relative;flex:none;width:48px;height:48px;min-width:48px;max-width:48px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;direction:ltr;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 2px;align-self:center}
.th.has{background:#15171a;color:transparent}
.th img{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);object-fit:contain;object-position:center;display:block}
.nm{direction:ltr;text-align:right;overflow:hidden}
html[dir=ltr] .nm{text-align:left}
.nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{display:block;color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm mark{background:#ffb84c40;color:inherit;border-radius:3px}
.ctl{color:var(--bad);font-weight:700}
.sz{color:var(--dim);font-size:12px;white-space:nowrap;direction:ltr}
.more{margin:12px auto;display:flex}
.empty{padding:30px 16px;color:var(--dim);text-align:center}
#selbar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:var(--panel2)}
#selbar span{flex:1;font-size:14px}
#selbar .btn{min-height:38px;padding:0 12px;font-size:14px}
.c3d{background:#4c9bff26;color:#7fb8ff}.cimg{background:#5ad18a26;color:#7fe0a5}.ccode{background:#c58cff26;color:#d6adff}
.cscene{background:#ffb84c26;color:#ffc874}.caudio{background:#ff7aa826;color:#ff9dbf}.cother{background:#ffffff14;color:#b8bec9}
/* dialogs */
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:0;width:min(720px,calc(100vw - 32px));max-height:calc(100vh - 48px)}
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:#000a}
.dh{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.dh b{flex:1;font-size:17px;overflow-wrap:anywhere}
.tabs{display:flex;gap:4px;padding:8px 12px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{min-height:40px;padding:0 12px;border:0;border-bottom:2px solid transparent;background:none;cursor:pointer;color:var(--dim);white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.dbody{padding:14px 16px;overflow:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0 0 14px}
.kv dt{color:var(--dim)}
.kv dd{margin:0;direction:ltr;text-align:right;overflow-wrap:anywhere}
html[dir=ltr] .kv dd{text-align:left}
.proj{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.proj h3{margin:0 0 10px;font-size:15px;direction:ltr;text-align:start}
.pkgs{display:flex;flex-wrap:wrap;gap:6px;direction:ltr}
.pkg{font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.pkg small{color:var(--dim)}
.dnote{font-size:12.5px;color:var(--dim);margin:0 0 10px}
.flist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.fitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;min-height:44px;padding:6px 12px;border:0;border-bottom:1px solid #2c3037;background:none;cursor:pointer;text-align:start}
.fitem:last-child{border-bottom:0}
.fitem:hover{background:var(--panel2)}
.fitem .tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;direction:ltr;min-width:42px;text-align:center}
.fitem bdi{direction:ltr;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:start}
.fitem small{color:var(--dim);direction:ltr;white-space:nowrap}
/* folder size bars (one series → single hue, value labels, no legend) */
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:10px;direction:ltr}
.crumbs button{border:0;background:none;color:var(--accent);cursor:pointer;padding:4px 6px;border-radius:6px;min-height:32px}
.crumbs button:hover{background:var(--panel2)}
.crumbs span{color:var(--dim)}
.bars{display:flex;flex-direction:column;gap:2px}
.bar{display:grid;grid-template-columns:minmax(90px,34%) minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;min-height:36px;padding:4px 8px;border:0;border-radius:8px;background:none;text-align:start;cursor:default}
.bar.dir{cursor:pointer}
.bar.dir:hover,.bar:focus-visible{background:var(--panel2)}
.bar .bl{direction:ltr;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:start}
.bar .bt{height:14px;border-radius:0 4px 4px 0;background:#ffffff0d;overflow:hidden;direction:ltr}
.bar .bf{display:block;height:100%;background:#4c9bff;border-radius:0 4px 4px 0;min-width:2px}
.bar .bv{color:var(--dim);font-size:12.5px;direction:ltr;white-space:nowrap}
/* GitHub-wide search */
#searchDlg{width:min(900px,calc(100vw - 32px))}
.tokbox{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:12px}
.tokbox summary{cursor:pointer;min-height:32px;display:flex;align-items:center;gap:6px;font-size:14px}
.tokbox summary #tokState{color:var(--dim);font-size:13px}
.tokbox .srow{margin-top:8px}
.tokbox a{color:var(--accent)}
.srow{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:12px}
.stabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--dim)}
.inp{min-height:42px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:15px}
.inp:focus{outline:2px solid var(--accent);outline-offset:1px}
.srange{display:flex;align-items:center;gap:8px;min-height:42px}
.srange input{width:170px;accent-color:var(--accent)}
.srange output{min-width:44px;color:var(--ink);font-variant-numeric:tabular-nums;direction:ltr}
#sRandom[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
#sProg{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:10px}
#sProg .xh{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:6px}
#sProg .btn{min-height:34px;padding:0 12px;font-size:13px}
.sresults{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.sres{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);cursor:pointer;text-align:start}
.sres:hover{border-color:#4a505b}
.sres:focus-visible{outline:2px solid var(--accent2);outline-offset:1px}
.sth{width:64px;height:64px;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:11px;font-weight:700;direction:ltr;background:#15171a;position:relative}
.sth img{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);object-fit:contain}
.sinfo{min-width:0}
.sinfo b,.sinfo small{display:block;direction:ltr;text-align:start;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sinfo small{color:var(--dim);font-size:12px}
.sinfo code{display:block;margin-top:4px;font:11.5px/1.4 ui-monospace,Consolas,monospace;color:#c8cdd6;direction:ltr;text-align:start;white-space:pre-wrap;overflow-wrap:anywhere;max-height:2.9em;overflow:hidden}
.sscore{align-self:start;font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px;background:#4c9bff2e;color:#9cc7ff;white-space:nowrap}
.sscore.exact{background:#5ad18a2e;color:#8fe3b0}
/* editor scan */
.finding{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
.finding>button{display:block;width:100%;border:0;background:var(--panel2);padding:8px 12px;text-align:start;cursor:pointer;direction:ltr}
.finding>button:hover{color:var(--accent)}
.hit{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:8px;align-items:baseline;width:100%;padding:6px 12px;border:0;border-top:1px solid #2c3037;background:none;cursor:pointer;text-align:start;direction:ltr}
.hit:hover{background:#ffffff08}
.hit code{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 ui-monospace,Consolas,monospace;color:#c8cdd6}
.badge{font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;white-space:nowrap}
.b-auto{background:#ff6b6b26;color:#ff9f9f}.b-build{background:#ffb84c26;color:#ffc874}.b-menu{background:#4c9bff26;color:#7fb8ff}.b-risk{background:#c58cff26;color:#d6adff}
.ln-no{color:var(--dim);font-size:12px}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px;font-size:12.5px;color:var(--dim)}
.prog{height:6px;border-radius:3px;background:#ffffff12;overflow:hidden;margin:6px 0 12px}
.prog i{display:block;height:100%;background:var(--accent);width:0}
@media(max-width:820px){
  main{grid-template-columns:1fr;grid-template-rows:52vh auto;flex:none}
  #selbar{position:sticky;bottom:0;z-index:5}
  #hier{top:58px;max-height:calc(100% - 120px)}
  main>aside{order:0;border-inline-end:0;border-top:1px solid var(--line)}
  #list{max-height:none;overflow:visible}
  body{overflow-y:auto}
  .tools .btn span{display:none}
  .tools .btn{width:38px;padding:0}
  #clips{max-height:76px}
  #anim{width:min(260px,calc(100% - 20px))}
  header h1{font-size:15px}
  .bar{grid-template-columns:minmax(80px,38%) minmax(0,1fr) auto}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

async function fetchWatched(url, opts = {}){

  const expect = size > 0 ? size : null;                 // real size from the file list (wire may be gzip)
  const ctrl = new AbortController();
  if(signal){ if(signal.aborted) ctrl.abort(); else signal.addEventListener('abort', () => ctrl.abort(), {once:true}); }

  const tick = () => { w.last = Date.now(); if(w.stalled){ w.stalled = false; stalls.delete(w); renderStall(); } };
  const timer = setInterval(() => {
    if(w.paused || w.stalled || Date.now() - w.last < STALL_MS) return;
    if(quiet){ ctrl.abort(); return; }                 // background work (thumbnails) just gives up
    w.stalled = true; stalls.add(w); renderStall();
  }, 1000);
  const xf = quiet ? null : xferStart(label || nameFromUrl(url), expect);
  let chunks = [], n = 0, total = null, resumable = false, r = null, ok = false;
  try{
    for(;;){
      try{
        const headers = {...(init.headers || {})};
        if(n > 0 && resumable) headers.Range = `bytes=${n}-`;
        else{ chunks = []; n = 0; }
        r = await fetch(url, {...init, headers, signal:ctrl.signal, referrerPolicy:'no-referrer'});

        if(n > 0 && r.status !== 206){ chunks = []; n = 0; }          // range not honoured → start over
        if(!r.ok) return {r, buf:null};

        if(ctrl.signal.aborted) throw new TErr('cancelled');

        finally{ w.paused = false; w.last = Date.now(); xferPause(xf, false); }

  xsess = newSess(); xsess.plan = bytes; xsess.planCount = count; xsess.open = true;
  $('xfer').classList.remove('done');
}
function xferPlanEnd(ok){ xsess.open = false; if(!ok) xsess.failed = true; if(!xfers.size) xferFinish(); }
function xferStart(name, expect){
  clearTimeout(xferHide);
  if(!xfers.size && !xsess.open && $('xfer').classList.contains('done')) xsess = newSess();
  const x = {name:plainName(name || ''), loaded:0, total:expect ?? null, paused:false};
  xfers.add(x); xsess.count++;
  $('xfer').classList.remove('done');
  xferRender();
  return x;
}
function xferUpdate(x, loaded, total){
  if(!x) return;
  x.loaded = loaded; x.total = total;
  if(!xferRaf) xferRaf = requestAnimationFrame(() => { xferRaf = 0; xferRender(); });
}
function xferPause(x, on){ if(x){ x.paused = on; xferRender(); } }
function xferEnd(x, ok){
  if(!x) return;
  xfers.delete(x);
  xsess.doneLoaded += x.loaded; xsess.doneTotal += x.total ?? x.loaded;
  if(x.total === null && !ok) xsess.unknown = true;
  if(!ok && !xsess.open) xsess.failed = true;
  if(xfers.size || xsess.open) return xferRender();      // a batch keeps the bar until it says it is done
  xferFinish();
}
function xferFinish(){
  if(xsess.failed){ $('xfer').hidden = true; xsess = newSess(); return; }
  // finished: keep the bar for a second with "done"
  $('xfer').hidden = false;
  $('xfer').classList.add('done');
  $('xferLabel').textContent = t('xferDone');
  $('xferNum').innerHTML = tIso('{0}', fmt(xsess.doneLoaded));
  setBar(100);
  xferHide = setTimeout(() => { $('xfer').hidden = true; $('xfer').classList.remove('done'); xsess = newSess(); }, 1000);
}
function setBar(pct){
  const bar = $('xferBar');
  bar.classList.toggle('ind', pct === null);
  bar.firstElementChild.style.width = pct === null ? '' : pct.toFixed(1) + '%';
  if(pct === null) bar.removeAttribute('aria-valuenow'); else bar.setAttribute('aria-valuenow', Math.round(pct));
}
function xferRender(){
  if(!xfers.size && !xsess.open) return;
  const act = [...xfers];
  const loaded = xsess.doneLoaded + act.reduce((a, x) => a + x.loaded, 0);
  const known = !xsess.unknown && act.every(x => x.total !== null);
  const total = xsess.plan ? Math.max(xsess.plan, loaded) : known && act.length ? xsess.doneTotal + act.reduce((a, x) => a + x.total, 0) : null;
  $('xfer').hidden = false;
  $('xferLabel').textContent = act.some(x => x.paused) ? t('netFail')
    : xsess.planCount ? t('xferMany', nf(xsess.planCount))
    : xsess.count > 1 || !act.length ? t('xferMany', nf(xsess.count)) : t('xferOne', act[0].name);
  if(total){
    const pct = Math.min(100, loaded / total * 100);
    $('xferNum').innerHTML = tIso('xferOf', fmt(loaded), fmt(total), Math.floor(pct) + '%');
    setBar(pct);
  }else{
    $('xferNum').innerHTML = tIso('{0}', fmt(loaded));
    setBar(null);
  }
}

function parseRepo(s){
  s = s.trim().replace(/\/+$/, '');
  let m = s.match(/^(?:https?:\/\/)?(?:www\.)?gitlab\.com\/(.+)$/i);
  if(m){
    let rest = m[1].replace(/[?#].*$/, ''), branch = null;
    const k = rest.indexOf('/-/');
    if(k >= 0){ const tail = rest.slice(k + 3).split('/'); if(tail[0] === 'tree' || tail[0] === 'blob') branch = tail[1] || null; rest = rest.slice(0, k); }
    rest = rest.replace(/\.git$/, '').replace(/\/+$/, '');
    if(!/^[\w.-]+(\/[\w.-]+)+$/.test(rest)) return null;
    try{ branch = branch && decodeURIComponent(branch); }catch(e){}
    return {kind:'gl', path:rest, id:encodeURIComponent(rest), branch};
  }
  s = s.replace(/\.git$/, '');
  m = s.match(/github\.com\/([^\/\s]+)\/([^\/\s#?]+)(?:\/tree\/([^\/?#]+))?/i);
  if(!m) m = s.match(/^([\w.-]+)\/([\w.-]+)$/);
  if(!m) return null;
  let br = m[3] || null; try{ br = br && decodeURIComponent(br); }catch(e){}
  return {kind:'gh', owner:m[1], name:m[2].replace(/\.git$/, ''), branch:br};
}

const mediaUrl = p => `https://media.githubusercontent.com/media/${repo.owner}/${repo.name}/${encodeURIComponent(repo.branch)}/${enc(p)}`;
const webUrl = p => repo?.kind === 'gh' ? `https://github.com/${repo.owner}/${repo.name}/blob/${encodeURIComponent(repo.branch)}/${enc(p)}`

let localUrls = new Map();
function revokeLocalUrls(){ localUrls.forEach(u => URL.revokeObjectURL(u)); localUrls = new Map(); }
/* URL a loader can fetch for a file (handles Git LFS) */
function fileUrl(f){
  if(repo.kind === 'local'){
    if(!localUrls.has(f.path)) localUrls.set(f.path, URL.createObjectURL(repo.map.get(f.path)));
    return localUrls.get(f.path);
  }
  if(repo.kind === 'gl') return rawUrl(f.path);
  return f.size !== null && f.size < 300 ? mediaUrl(f.path) : rawUrl(f.path);   // tiny = Git LFS pointer
}
/* ---- GitLab: anonymous requests are rate-limited per IP, so all GitLab traffic goes through
   one small queue (user actions before background work), a 429 pauses the queue and retries,
   and text files are fetched 50 at a time through GraphQL instead of one request each ---- */
const GL = {active:0, hi:[], lo:[], pauseUntil:0, timer:null, waiting:false};
function glPump(){
  const wait = GL.pauseUntil - Date.now();
  if(wait > 0){ if(!GL.timer) GL.timer = setTimeout(() => { GL.timer = null; glPump(); }, wait); return; }
  if(GL.waiting){ GL.waiting = false; renderNote(); }
  while(GL.active < 3 && (GL.hi.length || GL.lo.length)){ GL.active++; (GL.hi.shift() || GL.lo.shift())(); }
}
const glSlot = quiet => new Promise(res => { (quiet ? GL.lo : GL.hi).push(res); glPump(); });
async function glFetch(url, opts = {}){
  for(let attempt = 0; ; attempt++){
    await glSlot(opts.quiet);
    let res;
    try{ res = await fetchWatched(url, opts); }
    finally{ GL.active--; }
    if(res.r.status !== 429 || attempt >= 5){ glPump(); return res; }
    const ra = +res.r.headers.get('retry-after');
    GL.pauseUntil = Math.max(GL.pauseUntil, Date.now() + (ra > 0 ? ra * 1000 : 15000 * (attempt + 1)));
    GL.waiting = true; renderNote(); glPump();
  }
}
const GQL_BLOBS = 'query($p:ID!,$ref:String!,$paths:[String!]!){project(fullPath:$p){repository{blobs(ref:$ref,paths:$paths){nodes{path rawTextBlob}}}}}';
let glBatch = null;
function glText(path, quiet){
  return new Promise((resolve, reject) => {
    if(!glBatch){ glBatch = {items:[], quiet:true}; setTimeout(glFlush, 30); }
    glBatch.items.push({path, resolve, reject});
    if(!quiet) glBatch.quiet = false;
    if(glBatch.items.length >= 50) glFlush();
  });
}
async function glFlush(){
  const batch = glBatch; glBatch = null;
  if(!batch?.items.length) return;
  try{
    const {r, buf} = await glFetch('https://gitlab.com/api/graphql', {quiet:batch.quiet, label:batch.items.length === 1 ? batch.items[0].path.split('/').pop() : t('xferMany', nf(batch.items.length)), method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({query:GQL_BLOBS, variables:{p:repo.path, ref:repo.branch, paths:batch.items.map(b => b.path)}})});
    if(!r.ok) throw new TErr('ghErr', r.status);
    const j = JSON.parse(td.decode(buf));
    const nodes = new Map((j.data?.project?.repository?.blobs?.nodes || []).map(n => [n.path, n.rawTextBlob]));
    batch.items.forEach(b => b.resolve(typeof nodes.get(b.path) === 'string' ? nodes.get(b.path) : null));
  }catch(e){ batch.items.forEach(b => b.reject(e)); }
}

async function readLocal(file, opts){
  const xf = opts?.quiet ? null : xferStart(opts?.label || file.name, file.size);
  let ok = false;
  try{
    const reader = file.stream().getReader(), chunks = []; let n = 0;
    for(;;){ const {done, value} = await reader.read(); if(done) break; chunks.push(value); n += value.length; xferUpdate(xf, n, file.size); }
    const out = new Uint8Array(n); let o = 0;
    for(const c of chunks){ out.set(c, o); o += c.length; }
    ok = true;
    return out.buffer;
  }finally{ xferEnd(xf, ok); }
}
async function getBuffer(path, opts){
  opts = {...(opts || {}), label:opts?.label || path.split('/').pop()};
  if(repo.kind === 'local'){
    const file = repo.map.get(path); if(!file) throw new TErr('dlFail', 404);
    return readLocal(file, opts);
  }
  if(repo.kind === 'gl'){
    const {r, buf} = await glFetch(rawUrl(path), opts);
    if(r.status === 429) throw new TErr('rateLimit');
    if(!r.ok) throw new TErr('dlFail', r.status);
    return buf;
  }
  const known = fileByPath.get(path)?.size;
  let {r, buf} = await fetchWatched(rawUrl(path), {...opts, size: known >= 400 ? known : null});
  if(!r.ok) throw new TErr('dlFail', r.status);
  if(repo.kind === 'gh' && buf.byteLength < 400){
    const tt = td.decode(buf);
    if(tt.startsWith('version https://git-lfs')){
      ({r, buf} = await fetchWatched(mediaUrl(path), opts));
      if(!r.ok) throw new TErr('lfsFail');
    }
  }
  return buf;
}
const td = new TextDecoder();
const readText = async (p, opts) => {
  if(repo.kind === 'gl'){ const s = await glText(p, opts?.quiet); if(s !== null) return s; }   // binary/huge → raw fallback
  return td.decode(await getBuffer(p, opts));
};

/* ---------- GitHub / GitLab APIs ---------- */
async function apiJson(url, headers){
  const {r, buf} = await (url.startsWith('https://gitlab.com/') ? glFetch : fetchWatched)(url, {label:t('fetching'), ...(headers ? {headers} : {})});
  if(r.status === 401 && headers?.Authorization) throw new TErr('sTokenBad');
  if(r.status === 404 || r.status === 401) throw new TErr('notFound');
  if(r.status === 429 || (r.status === 403 && r.headers.get('x-ratelimit-remaining') === '0')) throw new TErr('rateLimit');
  if(r.status === 403 && repo?.kind === 'gl') throw new TErr('notFound');
  if(!r.ok) throw new TErr('ghErr', r.status);
  return JSON.parse(td.decode(buf));
}
// with a token: 5000 requests/hour instead of 60; a rejected token falls back to anonymous (public repos still open)
const ghApi = p => apiJson('https://api.github.com' + p, {Accept:'application/vnd.github+json', ...authHeaders()})
  .catch(e => { if(e?.k?.[0] === 'sTokenBad') return apiJson('https://api.github.com' + p, {Accept:'application/vnd.github+json'}); throw e; });
const glApi = p => apiJson('https://gitlab.com/api/v4' + p);

let repoNote = [];   // keys shown under the title
async function loadRepo(input){
  const p = parseRepo(input);
  if(!p){ setMsg(['badLink'], ['badLinkHint']); return; }
  closeMenus();
  clearView();
  repo = p; setFiles([]); repoNote = [];
  renderTitle(); renderNote(); renderSelbar();
  $('list').innerHTML = `<div class="empty">${esc(t('fetching'))}</div>`;
  $('filters').innerHTML = '';
  try{
    let list, truncated = false;
    if(p.kind === 'gh'){
      if(!p.branch) p.branch = (await ghApi(`/repos/${p.owner}/${p.name}`)).default_branch;
      const tr = await ghApi(`/repos/${p.owner}/${p.name}/git/trees/${encodeURIComponent(p.branch)}?recursive=1`);
      p.treeSha = tr.sha; truncated = tr.truncated;
      list = tr.tree.filter(x => x.type === 'blob').map(x => makeFile(x.path, x.size || 0));
    }else{
      const meta = await glApi(`/projects/${p.id}`);
      p.path = meta.path_with_namespace || p.path; p.id = meta.id;
      if(!p.branch) p.branch = meta.default_branch;
      if(!p.branch) throw new TErr('emptyRepo');
      try{ p.treeSha = (await glApi(`/projects/${p.id}/repository/branches/${encodeURIComponent(p.branch)}`)).commit.id; }catch(e){ p.treeSha = p.branch; }
      // the tree is paginated (100 per page); fetch 4 pages at a time until a short page
      list = [];
      let page = 1, done = false;
      while(!done){
        const batch = await Promise.all([0, 1, 2, 3].map(i =>
          glApi(`/projects/${p.id}/repository/tree?recursive=true&per_page=100&ref=${encodeURIComponent(p.branch)}&page=${page + i}`)));
        if(repo !== p) return;
        for(const arr of batch){
          if(done) break;
          list.push(...arr.filter(x => x.type === 'blob').map(x => makeFile(x.path, null)));
          if(arr.length < 100) done = true;
        }
        page += 4;
        setMsg(['fetching'], ['fetchedSoFar', nf(list.length)]);
        if(page > 400){ truncated = true; break; }
      }
    }
    if(repo !== p) return;
    setFiles(list);
    if(truncated) repoNote.push('truncated');
    if(!files.some(f => /(^|\/)Assets\//.test(f.path))) repoNote.push('noAssets');
    store.set('lastRepo', input);
    history.replaceState(null, '', '?repo=' + encodeURIComponent(repoKey()));
    afterLoad();
  }catch(e){
    if(repo !== p) return;
    $('list').innerHTML = `<div class="empty" style="color:var(--bad)">${esc(tx(errText(e)))}</div>`;
    setMsg(['cantFetch'], errText(e));
  }
}

const SKIP_DIRS = /(^|\/)(Library|Temp|Logs|obj|Obj|Build|Builds|UserSettings|\.git|\.vs|\.idea)\//;
function loadLocal(fileList, label){
  closeMenus();
  const map = new Map();
  for(const {file, path} of fileList){
    const p = path.replace(/^\/+/, '');
    if(SKIP_DIRS.test(p)) continue;
    if(!map.has(p)) map.set(p, file);
  }
  if(!map.size) return;
  clearView();
  repo = {kind:'local', label:label || null, map};
  setFiles([...map].map(([p, f]) => makeFile(p, f.size)).sort((a, b) => a.path.localeCompare(b.path)));
  repoNote = ['localNote'];
  history.replaceState(null, '', location.pathname);
  afterLoad();
  const viewable = files.filter(f => !f.deceptive && (VIEW3D.includes(f.ext) || f.ext === 'unity' || f.ext === 'prefab' || VIEWIMG.includes(f.ext) || VIEWAUD.includes(f.ext)));
  if(viewable.length === 1 || files.length <= 3 && viewable.length) selectRow(viewable.find(f => VIEW3D.includes(f.ext)) || viewable[0]);
}

/* drag & drop (files and folders) */
{
  let depth = 0;

  addEventListener('dragover', e => { if(hasFiles(e)) e.preventDefault(); });

const thumbs = new Map();

const thumbIO = new IntersectionObserver(entries => {
  for(const e of entries){
    if(!e.isIntersecting) continue;
    thumbIO.unobserve(e.target);
    const f = fileByPath.get(e.target.closest('.row')?.dataset.p);
    if(f && !thumbs.has(f.path)){ thumbs.set(f.path, 'pending'); thumbQ.push(f); pumpThumbs(); }
  }
}, {rootMargin:'150px'});
function resetThumbs(){ thumbGen++; thumbs.clear(); thumbQ = []; thumbCtx = {models:new Map(), mats:new Map(), texs:new Map()}; thumbIO.disconnect(); }
function observeThumbs(){
  document.querySelectorAll('#list .row').forEach(r => {
    const f = fileByPath.get(r.dataset.p);
    if(f && thumbKind(f) && !isSuspicious(f) && !thumbs.has(f.path)) thumbIO.observe(r.querySelector('.th'));
  });
}
function pumpThumbs(){
  while(thumbBusy < 3 && thumbQ.length){
    const f = thumbQ.shift(), gen = thumbGen;
    thumbBusy++;
    makeThumb(f).then(u => u, () => null).then(url => {
      thumbBusy--;
      if(gen !== thumbGen) return pumpThumbs();
      thumbs.set(f.path, url || 'none');
      const th = rowOf(f.path)?.querySelector('.th');
      if(th && url && !th.querySelector('img')){ const im = new Image(); im.alt = ''; im.src = url; th.appendChild(im); th.classList.add('has'); }

    });
  }
}
let thumbR = null;
function thumbRenderer(){
  if(thumbR) return thumbR;
  const r = new THREE.WebGLRenderer({antialias:true, alpha:true, preserveDrawingBuffer:true});
  r.setSize(96, 96, false); r.outputColorSpace = THREE.SRGBColorSpace;
  const sc = new THREE.Scene();
  sc.add(new THREE.HemisphereLight(0xffffff, 0x445066, 1.7));
  const d = new THREE.DirectionalLight(0xffffff, 2.2); d.position.set(3, 5, 4); sc.add(d);
  thumbR = {r, scene:sc, cam:new THREE.PerspectiveCamera(35, 1, .01, 1000)};
  return thumbR;
}
function renderThumb(obj){
  const T = thumbRenderer();
  T.scene.add(obj); obj.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(obj);
  let url = null;
  if(!box.isEmpty()){
    // frame the bounding sphere: the whole model fits and sits in the centre from any angle
    const sp = box.getBoundingSphere(new THREE.Sphere()), rad = sp.radius || 1;
    const dist = rad / Math.sin(T.cam.fov * Math.PI / 360) * 1.06;
    T.cam.position.copy(sp.center).add(new THREE.Vector3(1, .7, 1).normalize().multiplyScalar(dist));
    T.cam.near = Math.max(dist - rad * 1.5, dist / 1000); T.cam.far = dist + rad * 1.5; T.cam.updateProjectionMatrix();
    T.cam.lookAt(sp.center);
    T.r.render(T.scene, T.cam);
    url = T.r.domElement.toDataURL('image/png');
  }
  T.scene.remove(obj);
  return url;
}
async function makeThumb(f){
  const kind = thumbKind(f);
  if(kind === 'img'){
    if(f.size > 25 * 1048576) return null;
    const buf = await checkedBuffer(f, {quiet:true});
    const bmp = await createImageBitmap(new Blob([buf]));
    const k = Math.min(96 / bmp.width, 96 / bmp.height, 1);
    const cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(bmp.width * k)); cv.height = Math.max(1, Math.round(bmp.height * k));
    cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height); bmp.close();
    return cv.toDataURL('image/png');
  }
  if(kind === '3d'){
    if(f.size > 20 * 1048576) return null;
    const {obj} = await loadModelObject(f, {quiet:true});
    await new Promise(r => setTimeout(r, 300));   // let embedded textures decode
    const url = renderThumb(obj); disposeObj(obj);
    return url;
  }
  if(kind === 'mat'){
    const m = await loadMat(f.path, thumbCtx, {quiet:true});
    if(!m) return null;
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(.5, 48, 24), m);
    const url = renderThumb(mesh); mesh.geometry.dispose();

  }

}

function makeManager(){
  const m = new THREE.LoadingManager();

    try{ n = decodeURIComponent(n); }catch(e){}
    n = n.toLowerCase();
    const dot = n.lastIndexOf('.'), stem = dot > 0 ? n.slice(0, dot) : n, ext = dot > 0 ? n.slice(dot+1) : '';
    // textures the browser can't decode (psd/tif/exr…) → try a same-named png/jpg/tga
    const tries = WEBTEX.includes(ext) ? [n] : WEBTEX.map(e => stem + '.' + e);

    if(hit.endsWith('.tga') && !n.endsWith('.tga')) return BLANK_PNG; // loader picked by original name, can't swap to TGA
    const f = fileByPath.get(byName.get(hit));

    const s = prepAndCount(obj);
    clips = anims || [];
    if(clips.length){ mixer = new THREE.AnimationMixer(obj); mixer.timeScale = +$('aSpeed').value; playClip(0); }
    renderAnimUI();
    let bones = 0; obj.traverse(o => { if(o.isBone) bones++; });
    $('tBones').hidden = !bones;
    if(bones && bonesOn) showBones(true);
    frame(false);
    hideMsg();
    setInfo(() => `<b>${safeHtml(f.name)}</b>` + (extra ? extra() : '')
      + (kind === 'mat' ? '' : ` · ${t('meshes', nf(s.meshes))} · ${t('verts', nf(s.verts))} · ${t('tris', nf(s.tris))}`)
      + (bones ? ` · ${t('bonesN', nf(bones))}` : '') + (clips.length ? ` · ${t('animsN', clips.length)}` : ''));
    if(kind === 'unity') showHierarchy(obj);
    if(measureOn) updateMeasure();
  }catch(e){
    if(token !== loadToken) return;
    if(e instanceof Silent) return silent();
    console.warn(e); clearModel();
    setMsg([kind === '3d' ? 'cantShowModel' : 'cantShowFile'], errText(e), webUrl(f.path));
  }
}

/* image transparency: sample the decoded pixels (downscaled) */
function hasAlpha(img, ext){
  if(ext === 'jpg' || ext === 'jpeg' || ext === 'bmp') return false;
  try{
    const k = Math.min(1, 256 / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(img.naturalWidth * k)); cv.height = Math.max(1, Math.round(img.naturalHeight * k));
    const cx = cv.getContext('2d', {willReadFrequently:true}); cx.drawImage(img, 0, 0, cv.width, cv.height);
    const d = cx.getImageData(0, 0, cv.width, cv.height).data;
    for(let i = 3; i < d.length; i += 4) if(d[i] < 250) return true;
  }catch(e){}
  return false;
}

/* plain-text preview: every line is set with textContent, never parsed as HTML */
const MAX_LINES = 6000;
function showText(f, buf, line){
  const b = new Uint8Array(buf, 0, Math.min(buf.byteLength, 8192));
  let nul = 0; for(const x of b) if(x === 0) nul++;
  if(nul > 4){ setMsg(plainName(f.name), ['binaryFile'], webUrl(f.path)); return; }
  const lines = td.decode(buf).split(/\r?\n/);
  const tv = $('textview'); tv.textContent = '';
  const frag = document.createDocumentFragment();
  lines.slice(0, MAX_LINES).forEach((l, i) => {
    const d = document.createElement('div'); d.className = 'ln'; d.dataset.n = i + 1;
    d.textContent = l.replace(HIDDEN_RE_G, c => c === '\t' ? '    ' : `[${codeOf(c)}]`);
    if(line && i + 1 === line) d.classList.add('hit');
    frag.appendChild(d);
  });
  if(lines.length > MAX_LINES){ const d = document.createElement('div'); d.className = 'more'; d.textContent = t('tooBig', nf(MAX_LINES)); frag.appendChild(d); }
  tv.appendChild(frag);
  hideMsg(); tv.style.display = 'block';
  setInfo(() => `<b>${safeHtml(f.name)}</b> · ${nf(lines.length)} · ${fmt(buf.byteLength)}`);
  if(line) tv.querySelector('.ln.hit')?.scrollIntoView({block:'center'});
}

/* loads any supported 3D file into a three.js object (no scene changes) */
async function loadModelObject(f, opts){
  const base = repo.kind === 'gh' ? rawUrl(f.dir ? f.dir + '/' : '').replace(/[^/]*$/, '') : '';
  const mgr = makeManager();
  const mat = () => new THREE.MeshStandardMaterial({color:0xc9ced6, roughness:.6, metalness:.1});
  const buf = await checkedBuffer(f, opts);
  const text = () => td.decode(buf);
  let obj, anims = [];
  switch(f.ext){
    case 'gltf': case 'glb': { const g = await parseP(new GLTFLoader(mgr), buf, base); obj = g.scene; anims = g.animations; break; }
    case 'fbx': obj = new FBXLoader(mgr).parse(buf, base); anims = obj.animations || []; break;
    case 'obj': obj = new OBJLoader(mgr).parse(text()); break;
    case 'dae': { const c = new ColladaLoader(mgr).parse(text(), base); obj = c.scene; anims = c.animations || obj.animations || []; break; }
    case '3ds': obj = new TDSLoader(mgr).parse(buf, base); break;
    case 'stl': { const g = new STLLoader().parse(buf); g.computeVertexNormals(); obj = new THREE.Mesh(g, mat()); break; }
    case 'ply': { const g = new PLYLoader().parse(buf); g.computeVertexNormals();
      const m = mat(); if(g.attributes.color){ m.vertexColors = true; m.color.set(0xffffff); }
      obj = new THREE.Mesh(g, m); break; }
    default: throw new TErr('unsupported', f.ext);
  }
  // FBX keeps file units (usually cm); everything else is treated as metres
  const unit = f.ext === 'fbx' ? (obj.userData.unitScaleFactor ?? 1) / 100 : 1;
  return {obj, anims, unit};
}

function prepAndCount(obj){
  let verts = 0, tris = 0, meshes = 0;
  obj.traverse(o => {
    if(!o.isMesh || o.userData.placeholder) return; meshes++;
    const g = o.geometry, n = g.attributes.position?.count || 0;
    verts += n; tris += (g.index ? g.index.count : n) / 3;
    [].concat(o.material).forEach(m => {
      if(!m) return;
      m.wireframe = wire;
      // drop placeholder textures with no image (e.g. missing .dds) — they render black
      for(const k in m){ const tt = m[k]; if(tt && tt.isTexture && !tt.image && !tt.isDataTexture){ m[k] = null; m.needsUpdate = true; } }
    });
  });
  return {verts, tris, meshes};
}

/* camera: fit on first model / reset button; otherwise (locked) keep where it is */
function frame(force){
  if(!current) return;
  const box = new THREE.Box3().setFromObject(current);
  if(box.isEmpty()) return;
  const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
  const r = Math.max(size.x, size.y, size.z) || 1;
  // locked camera: stay put, unless the new model is completely out of view
  let inView = true;
  if(camLock && fittedOnce && !force){
    camera.far = Math.max(camera.far, camera.position.distanceTo(center) + r * 2); camera.updateProjectionMatrix();
    camera.updateMatrixWorld();
    const fr = new THREE.Frustum().setFromProjectionMatrix(new THREE.Matrix4().multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse));
    inView = fr.intersectsBox(box);
  }
  if(force || !camLock || !fittedOnce || !inView){
    const d = r / (2 * Math.tan(camera.fov * Math.PI / 360)) * 1.6;
    camera.position.copy(center).add(new THREE.Vector3(1, .7, 1).normalize().multiplyScalar(d));
    controls.target.copy(center); controls.update();
    fittedOnce = true;
  }
  const dist = camera.position.distanceTo(center);
  camera.near = Math.max(Math.min(r, dist) / 1000, 1e-4);
  camera.far = Math.max(r * 1000, (dist + r) * 10);
  camera.updateProjectionMatrix();
  const vis = grid.visible; scene.remove(grid); grid.geometry.dispose();
  grid = new THREE.GridHelper(r * 4, 20, 0x4c9bff, 0x3a404a);
  grid.position.set(center.x, box.min.y, center.z); grid.visible = vis; scene.add(grid);
}

/* ---------- skeleton ---------- */

/* ---------- animations ---------- */
function playClip(i){
  if(!mixer || !clips[i]) return;
  mixer.stopAllAction();
  const a = mixer.clipAction(clips[i]);
  a.reset(); a.paused = false; a.play();
  activeClip = i;
  renderAnimUI();
}
function renderAnimUI(){
  $('anim').hidden = !clips.length;
  if(!clips.length) return;
  $('clips').innerHTML = clips.map((c, i) => `<button type="button" class="clip${i === activeClip ? ' on' : ''}" data-i="${i}" aria-pressed="${i === activeClip}"><bdi>${safeHtml(c.name || ('Clip ' + (i + 1)))}</bdi><small>${c.duration.toFixed(2)}s</small></button>`).join('');
  const a = activeClip >= 0 && mixer ? mixer.clipAction(clips[activeClip]) : null;
  $('aPlay').textContent = a && !a.paused && a.isRunning() ? t('pause') : t('play');
}
$('clips').addEventListener('click', e => { const b = e.target.closest('.clip'); if(b) playClip(+b.dataset.i); });
$('aPlay').onclick = () => {

};

/* ---------- measure ---------- */
function fmtLen(units){

}

/* =====================================================================
   Unity .unity / .prefab / .mat  (text-serialized YAML)
   ===================================================================== */
const BUILTIN_EXTRA = '0000000000000000e000000000000000';   // Library/unity default resources (primitives)
const UNITY_PARSE = new Set([4, 224, 33, 23, 137, 1001, 21]); // classes we fully parse
const num = (v, d) => { const n = parseFloat(v); return isFinite(n) ? n : d; };

/* split a Unity YAML file into documents; heavy/unneeded classes are only regex-scanned */
function parseUnityYaml(text){
  if(!/^%YAML/.test(text)) throw new TErr('binaryScene');
  const heads = [], re = /^--- !u!(\d+) &(-?\d+)( stripped)?[^\n]*\n/gm;
  let m;
  while((m = re.exec(text))) heads.push({cls:+m[1], id:m[2], stripped:!!m[3], start:re.lastIndex, at:m.index});
  const docs = new Map();
  heads.forEach((h, i) => {
    const body = text.slice(h.start, i + 1 < heads.length ? heads[i+1].at : text.length);
    const type = (body.match(/^(\w+):/) || [])[1] || '';
    const doc = {cls:h.cls, id:h.id, stripped:h.stripped, type, d:{}};
    doc.go = (body.match(/m_GameObject: \{fileID: (-?\d+)/) || [])[1];
    if(h.cls === 1){
      const nm = (body.match(/^  m_Name: ?(.*)$/m) || [])[1] || '';
      doc.d.m_Name = nm.replace(/^(['"])(.*)\1$/, '$2').trim();
      doc.d.m_IsActive = +((body.match(/m_IsActive: (\d)/) || [])[1] ?? 1);
      doc.d.m_PrefabInstance = (body.match(/m_PrefabInstance: \{fileID: (-?\d+)/) || [])[1];
      doc.d.src = (body.match(/m_CorrespondingSourceObject: \{fileID: (-?\d+)/) || [])[1];
    }else if(UNITY_PARSE.has(h.cls) || h.stripped){
      try{
        const o = yamlLoad(body.replace(/(fileID|guid): (-?[0-9a-fA-F]+)/g, '$1: "$2"'));
        doc.d = (o && o[type]) || {};
      }catch(e){ return; }
    }else{
      doc.script = (body.match(/m_Script: \{fileID: -?\d+, guid: ([0-9a-f]{32})/) || [])[1];
      doc.enabled = +((body.match(/^  m_Enabled: (\d)/m) || [])[1] ?? 1);
    }
    docs.set(h.id, doc);
  });
  return docs;
}

/* ---- GUID index from .meta files ----
   phase A (needed to draw): models, prefabs, materials, textures. phase B: scripts (labels), in background.
   ensureFullIndex() adds every other asset (for "used by" / "unused files").
   Remote repos keep it in localStorage per tree SHA, so it is built once. */
let guidIndex = null, guidIndexP = null, scriptsReady = false, metaDone = new Set(), fullIndex = false;
const IDX_A = [...VIEW3D, 'prefab', 'mat', ...WEBTEX, 'psd', 'tif', 'tiff'];
const idxKey = () => repo.kind === 'gh' ? `gidx:${repo.owner}/${repo.name}@${repo.treeSha}` : repo.kind === 'gl' ? `gidx:gl:${repo.path}@${repo.treeSha}` : null;
const assetExt = p => (p.split('/').pop().match(/\.([^.]+)$/) || [])[1]?.toLowerCase() || '';
function metaTodo(exts){
  return files.filter(f => f.cat === 'meta' && !metaDone.has(f.path)).map(f => {
    const asset = f.path.slice(0, -5);
    return {meta:f.path, asset, ext:assetExt(asset)};
  }).filter(x => fileByPath.has(x.asset) && (!exts || exts.includes(x.ext))).slice(0, 12000);
}
async function indexMetas(todo, map, onProgress){
  let done = 0;
  await pool(todo, repo.kind === 'local' ? 16 : repo.kind === 'gl' ? 100 : 48, async x => {
    try{
      const tt = await readText(x.meta, {quiet:true}), g = (tt.match(/^guid: ([0-9a-f]{32})/m) || [])[1];
      if(g) map.set(g, {path:x.asset, ext:x.ext});
      metaDone.add(x.meta);
    }finally{ onProgress?.(++done, todo.length); }
  });
}
function saveIndex(){
  const key = idxKey(); if(!key || !guidIndex) return;
  try{
    for(let i = localStorage.length - 1; i >= 0; i--){ const k = localStorage.key(i); if(k?.startsWith('gidx:') && k !== key) localStorage.removeItem(k); }
  }catch(e){}
  store.set(key, {full:fullIndex, list:[...guidIndex].map(([g, v]) => [g, v.path])});
}
function loadIndexCache(){
  const key = idxKey(); if(!key) return false;
  const c = store.get(key, null);
  const list = Array.isArray(c) ? c : c?.list;                 // older cache = plain list
  if(!Array.isArray(list)) return false;
  guidIndex = new Map(list.map(([g, p]) => [g, {path:p, ext:assetExt(p)}]));
  guidIndex.forEach(v => metaDone.add(v.path + '.meta'));
  scriptsReady = true; fullIndex = !!c?.full;
  return true;
}
function buildGuidIndex(onProgress, onScripts){
  if(guidIndex) return Promise.resolve(guidIndex);
  if(guidIndexP) return guidIndexP;
  if(loadIndexCache()) return Promise.resolve(guidIndex);
  const forRepo = repo, map = new Map();
  guidIndexP = indexMetas(metaTodo(IDX_A), map, onProgress).then(() => {
    if(repo !== forRepo) return map;
    guidIndex = map;
    indexMetas(metaTodo(['cs']), map).then(() => {
      if(repo !== forRepo) return;
      scriptsReady = true; saveIndex(); onScripts?.();
    });
    return map;
  });
  return guidIndexP;
}
let fullIndexP = null;
async function ensureFullIndex(onProgress){
  await buildGuidIndex();
  if(fullIndex) return guidIndex;
  if(!fullIndexP){
    const forRepo = repo;
    fullIndexP = indexMetas(metaTodo(null), guidIndex, onProgress).then(() => {
      if(repo === forRepo){ fullIndex = true; scriptsReady = true; saveIndex(); }
      fullIndexP = null;
    });
  }
  await fullIndexP;
  return guidIndex;
}
async function pool(items, n, fn){
  let i = 0;
  await Promise.all(Array.from({length:Math.min(n, items.length)}, async () => {
    while(i < items.length){ const k = i++; try{ await fn(items[k]); }catch(e){} }
  }));
}

/* model .meta → fileID tables, import scale, material remaps */
function parseModelMeta(tt){
  const table = new Map();                 // fileID → {cls, name}
  const sec = tt.match(/fileIDToRecycleName:\r?\n((?: {4}.*\r?\n)+)/);
  if(sec) for(const l of sec[1].split(/\r?\n/)){
    const m = l.match(/^ {4}(-?\d+): (.*)$/); if(m) table.set(m[1], {cls:Math.floor(Math.abs(+m[1]) / 100000), name:m[2].trim()});
  }
  for(const m of tt.matchAll(/- first:\s*\n\s*(\d+): (-?\d+)\s*\n\s*second: (.*)/g)) table.set(m[2], {cls:+m[1], name:m[3].trim()});
  const ext = new Map();
  for(const m of tt.matchAll(/type: UnityEngine:Material\s*\n\s*assembly: .*\n\s*name: (.*)\n\s*second: \{fileID: -?\d+, guid: ([0-9a-f]{32})/g)) ext.set(m[1].trim(), m[2]);
  return {
    table, extMats: ext,
    globalScale: num((tt.match(/globalScale: ([\d.eE+-]+)/) || [])[1], 1),
    useFileScale: +((tt.match(/useFileScale: (\d)/) || [])[1] ?? 1),
    preserveHierarchy: +((tt.match(/preserveHierarchy: (\d)/) || [])[1] ?? 0),
  };
}

/* Unity (left-handed) → three.js (right-handed): mirror Z */
function applyU(n){
  const u = n.userData.u;
  n.position.set(u.p.x, u.p.y, -u.p.z);
  n.quaternion.set(-u.q.x, -u.q.y, u.q.z, u.q.w);
  if(n.quaternion.lengthSq() < 1e-8) n.quaternion.identity(); else n.quaternion.normalize();
  n.scale.set(u.s.x, u.s.y, u.s.z);
}
const vec = (o, d = 0) => ({x:num(o?.x, d), y:num(o?.y, d), z:num(o?.z, d)});
const quat = o => ({x:num(o?.x, 0), y:num(o?.y, 0), z:num(o?.z, 0), w:num(o?.w, 1)});
function setMod(n, path, value){
  const m = path.match(/^m_Local(Position|Rotation|Scale)\.([xyzw])$/);
  if(m && n.userData.u){ n.userData.u[{Position:'p', Rotation:'q', Scale:'s'}[m[1]]][m[2]] = num(value, 0); applyU(n); return true; }
  return false;
}

/* built-in primitive meshes (already in three space; all symmetric) */
function primitive(fileID){
  switch(+fileID){
    case 10202: return new THREE.BoxGeometry(1, 1, 1);
    case 10207: return new THREE.SphereGeometry(.5, 32, 16);
    case 10206: return new THREE.CylinderGeometry(.5, .5, 2, 32);
    case 10208: return new THREE.CapsuleGeometry(.5, 1, 8, 24);
    case 10209: return new THREE.PlaneGeometry(10, 10).rotateX(-Math.PI / 2);
    case 10210: return new THREE.PlaneGeometry(1, 1);
  }
  return null;
}
const defaultMat = () => new THREE.MeshStandardMaterial({color:0xcfd3da, roughness:.6, metalness:0});
const placeholderMat = new THREE.MeshBasicMaterial({color:0x8892a0, wireframe:true, transparent:true, opacity:.45});

async function needIndexFor(text, token){
  if(/guid: (?!0{16})[0-9a-f]{32}/.test(text) && files.some(x => x.cat === 'meta')){
    await buildGuidIndex(
      (d, n) => { if(token === loadToken && d % 20 === 0) setMsg(['indexing'], `${d} / ${n}`); },
      () => { if(current && !$('tHier').hidden) showHierarchy(current, true); });
  }
}
async function buildUnityFile(f, token){
  const text = td.decode(await checkedBuffer(f));
  const docs = parseUnityYaml(text);
  await needIndexFor(text, token);
  if(token !== loadToken) return {obj:new THREE.Group(), anims:[]};
  setMsg(['building'], plainName(f.name));
  const ctx = {models:new Map(), mats:new Map(), texs:new Map(), docCache:new Map([[f.path, Promise.resolve(docs)]]),
               stats:{gos:0, inst:0, missing:0, missingPrefabs:0}};
  const root = new THREE.Group();
  root.name = f.name; root.userData.h = {name:f.name, comps:[], isRoot:true};
  const res = await buildDocs(docs, ctx, 0, [f.path]);
  res.roots.forEach(r => root.add(r));
  const st = ctx.stats;
  const extra = () => ` · ${t('gos', nf(st.gos))}` + (st.inst ? ` · ${t('prefabsN', nf(st.inst))}` : '')
    + (st.missing ? ` · <span style="color:var(--accent2)">${esc(t('missingMesh', st.missing))}</span>` : '')
    + (st.missingPrefabs ? ` · <span style="color:var(--accent2)">${esc(t('missingPrefab', st.missingPrefabs))}</span>` : '');
  return {obj:root, anims:[], extra, unit:1};
}

/* .mat preview: the material on a sphere, like Unity's inspector */
async function buildMatPreview(f, token){
  const text = td.decode(await checkedBuffer(f));
  await needIndexFor(text, token);
  if(token !== loadToken) return {obj:new THREE.Group(), anims:[]};
  const ctx = {models:new Map(), mats:new Map(), texs:new Map()};
  const m = await loadMat(f.path, ctx, null, text);
  if(!m) throw new TErr('cantShowFile');
  const g = new THREE.Group();
  g.add(new THREE.Mesh(new THREE.SphereGeometry(.5, 96, 48), m));
  const i = m.userData.info || {};
  const extra = () => ` · ${esc(t('matInfo'))}: ${safeHtml(m.name || '—')}`
    + ` · ${esc(t('matColor'))}: <span style="display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:middle;border:1px solid #fff4;background:${esc(i.hex || '#ffffff')}"></span> ${esc(i.hex || '—')}`
    + ` · ${esc(t('matTex'))}: ${i.tex ? safeHtml(i.tex.split('/').pop()) : esc(t('matNone'))}`
    + (i.shader ? ` · ${esc(t('matShader'))}: ${safeHtml(i.shader.split('/').pop())}` : '')
    + (i.smooth !== undefined ? ` · ${esc(t('matSmooth'))}: ${esc(i.smooth)}` : '');
  return {obj:g, anims:[], extra, unit:1};
}

const guidPath = g => guidIndex?.get(g);

/* builds the GameObject tree of one YAML file. returns roots + fileID→object map */
async function buildDocs(docs, ctx, depth, stack){
  const byId = new Map(), gos = new Map(), tnodes = new Map(), jobs = [], roots = [];
  for(const doc of docs.values()){
    if(doc.cls === 1 && !doc.stripped){
      gos.set(doc.id, {name:doc.d.m_Name || 'GameObject', active:doc.d.m_IsActive !== 0, comps:[], id:doc.id});

    if(g && gos.has(g)) gos.get(g).comps.push(doc);
  }
  for(const doc of docs.values()){
    if(doc.stripped || !(doc.cls === 4 || doc.cls === 224)) continue;
    const d = doc.d, n = new THREE.Group();
    n.userData.u = {p:vec(d.m_LocalPosition, 0), q:quat(d.m_LocalRotation), s:vec(d.m_LocalScale, 1)};
    applyU(n);
    const g = gos.get(d.m_GameObject?.fileID);
    if(g){

    if(!doc.stripped) continue;
    const inst = insts.get(doc.d.m_PrefabInstance?.fileID || doc.d.m_PrefabInstance);
    const src = doc.d.m_CorrespondingSourceObject?.fileID || doc.d.src;

  const attach = id => {
    const tn = tnodes.get(id); if(!tn || placed.has(id)) return; placed.add(id);
    const p = tn.father !== '0' ? byId.get(tn.father) : null;

  for(const [, r] of insts){
    const p = r.parent !== '0' ? byId.get(r.parent) : null;
    if(p) p.add(r.root); else roots.push(r.root);

function compName(c){

async function meshFor(ref, rend, g, ctx){
  const mats = rend ? await Promise.all((rend.d.m_Materials || []).map(m => matFor(m, ctx))) : [];
  const finish = (geo, wrap) => {
    const ms = mats.filter(Boolean);
    const material = !ms.length ? defaultMat() : (geo.groups.length > 1 ? geo.groups.map((_, i) => ms[Math.min(i, ms.length - 1)]) : ms[0]);
    const mesh = new THREE.Mesh(geo, material);
    mesh.userData.skip = true;
    if(rend && rend.d.m_Enabled === 0) mesh.visible = false;
    if(wrap){ const w = new THREE.Group(); w.userData.skip = true; w.rotation.y = Math.PI; w.scale.setScalar(wrap); w.add(mesh); g.node.add(w); }
    else g.node.add(mesh);
    return mesh;
  };
  if(ref.guid === BUILTIN_EXTRA){
    const geo = primitive(ref.fileID);
    if(geo) return finish(geo, 0);
  }else if(ref.guid){
    const info = guidPath(ref.guid);
    if(info && VIEW3D.includes(info.ext)){
      const md = await modelFor(info, ctx);
      if(md){
        const want = md.meta.table.get(ref.fileID)?.name;
        const meshes = []; md.obj.traverse(o => o.isMesh && meshes.push(o));
        const hit = (want && meshes.find(o => o.name === want)) || (meshes.length === 1 && meshes[0]) || meshes.find(o => o.name === g.name);
        if(hit) return finish(hit.geometry, md.us);

    }
  }
  ctx.stats.missing++;
  const ph = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), placeholderMat);
  ph.userData.skip = ph.userData.placeholder = true;
  g.node.add(ph);
  return null;
}

function modelFor(info, ctx){
  if(!ctx.models.has(info.path)) ctx.models.set(info.path, (async () => {
    const f = fileByPath.get(info.path); if(!f || isSuspicious(f)) return null;
    try{
      const [{obj}, metaText] = await Promise.all([
        loadModelObject(f),
        fileByPath.has(info.path + '.meta') ? readText(info.path + '.meta').catch(() => '') : '']);
      const meta = parseModelMeta(metaText);
      const usf = obj.userData.unitScaleFactor ?? 1;
      const us = meta.globalScale * (f.ext === 'fbx' && meta.useFileScale ? usf / 100 : 1);
      return {obj, meta, us, f};
    }catch(e){ if(!(e instanceof Silent)) console.warn('model', info.path, e); return null; }
  })());

}

/* ---- materials (.mat) ---- */

  const sp = d.m_SavedProperties || {};

      tt.wrapS = tt.wrapT = THREE.RepeatWrapping;
      if(tx0.m_Scale) tt.repeat.set(num(tx0.m_Scale.x, 1), num(tx0.m_Scale.y, 1));

/* ---- PrefabInstance: nested .prefab or a model file ---- */
async function buildInstance(d, ctx, depth, stack){

  const guid = d.m_SourcePrefab?.guid, info = guid && guidPath(guid);
  let root = null, map = new Map();
  if(info && info.ext === 'prefab' && depth < 6 && !stack.includes(info.path)){
    try{

      const docs = await ctx.docCache.get(info.path);
      const r = await buildDocs(docs, ctx, depth + 1, [...stack, info.path]);

      if(r.roots.length !== 1){

  }

    const ph = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), placeholderMat); ph.userData.skip = ph.userData.placeholder = true; root.add(ph);
    const byT = new Map(); mods.forEach(m => { if(/^m_Local/.test(m.propertyPath)) byT.set(m.target?.fileID, (byT.get(m.target?.fileID) || 0) + 1); });
    const rootT = [...byT].sort((a, b) => b[1] - a[1])[0]?.[0];
    if(rootT) map.set(rootT, root);

    else if(p === 'm_IsActive'){ n.visible = String(m.value) !== '0'; if(n.userData.h) n.userData.h.active = n.visible; }
    else if(p === 'm_Enabled' && n.isMesh){ n.visible = String(m.value) !== '0'; }

        if(!mt) return;
        if(Array.isArray(n.material)){ n.material[i] = mt; } else if(i === 0) n.material = mt;
        mt.wireframe = wire;
      });
    }
  }
  return {root, map, parent};
}

/* model file used as a prefab (dragged FBX in the scene) */
function instantiateModel(md, mods, ctx){
  const src = SkeletonUtils.clone(md.obj);
  const map = new Map();
  const tops = src.children.filter(c => !c.isLight && !c.isCamera);
  const collapse = !md.meta.preserveHierarchy && tops.length === 1;
  const root = new THREE.Group();
  const content = collapse ? tops[0] : src;
  const name = md.f.name.replace(/\.[^.]+$/, '');
  root.name = name;
  const u = {p:vec(), q:quat(), s:vec(null, 1)};
  if(collapse){                                  // node TRS (FBX, right-handed) → Unity (mirror X)
    const c = content;
    u.p = {x:-c.position.x * md.us, y:c.position.y * md.us, z:c.position.z * md.us};
    u.q = {x:c.quaternion.x, y:-c.quaternion.y, z:-c.quaternion.z, w:c.quaternion.w};
    u.s = {x:c.scale.x, y:c.scale.y, z:c.scale.z};
    c.position.set(0, 0, 0); c.quaternion.identity(); c.scale.set(1, 1, 1);
  }
  root.userData.u = u; applyU(root);
  const wrap = new THREE.Group(); wrap.userData.skip = true;
  wrap.rotation.y = Math.PI; wrap.scale.setScalar(md.us);
  if(collapse){ content.children.slice().forEach(ch => wrap.add(ch)); if(content.isMesh){ const mm = new THREE.Mesh(content.geometry, content.material); mm.name = name; wrap.add(mm); } }
  else wrap.add(src);
  root.add(wrap);
  root.userData.h = {name, comps:['Model'], model:true};
  wrap.traverse(o => {
    if(!o.isMesh) return;
    const list = [].concat(o.material);
    list.forEach((mt, i) => {
      const g = md.meta.extMats.get(mt?.name) || (() => { const p = byName.get((mt?.name || '').toLowerCase() + '.mat'); if(!p) return null; for(const [k, v] of guidIndex || []) if(v.path === p) return k; return null; })();
      if(g) matFor({fileID:'2100000', guid:g}, ctx).then(nm => { if(!nm) return; nm.wireframe = wire; if(Array.isArray(o.material)) o.material[i] = nm; else o.material = nm; });
    });
  });
  const byName2 = new Map(); wrap.traverse(o => { if(o.name && !byName2.has(o.name)) byName2.set(o.name, o); });
  for(const [id, e] of md.meta.table){
    if(e.name === '//RootNode' || e.name === name){ if(e.cls === 1 || e.cls === 4) map.set(id, root); if((e.cls === 23 || e.cls === 137) && collapse && content.isMesh) { const mm = wrap.children.find(x => x.isMesh && x.name === name); if(mm) map.set(id, mm); } continue; }
    const o = byName2.get(e.name); if(!o) continue;
    if(e.cls === 1 || e.cls === 4) map.set(id, o);
    else if((e.cls === 23 || e.cls === 137) && o.isMesh) map.set(id, o);
  }
  if(![...map.values()].includes(root)){
    const byT = new Map();
    mods.forEach(m => { if(/^m_Local|^m_RootOrder/.test(m.propertyPath)) byT.set(m.target?.fileID, (byT.get(m.target?.fileID) || 0) + 1); });
    const rootT = [...byT].sort((a, b) => b[1] - a[1])[0]?.[0];
    if(rootT && !map.has(rootT)) map.set(rootT, root);
  }
  return {root, map};
}

let selHelper = null;
function showHierarchy(root, refresh){
  const open = refresh ? new Set([...$('htree').querySelectorAll('details[open]>summary>.hn')].map(b => b.dataset.u)) : null;

  const walk = (o, depth) => {
    const flat = [];
    const gather = list => list.forEach(c => { if(c.userData.skip){ if(!c.isMesh) gather(c.children); } else flat.push(c); });
    gather(o.children);
    const h = o.userData.h || {};

    const comps = (h.comps || []).map(compName).filter(c => c !== 'Transform' && c !== 'RectTransform');

      }finally{ onProgress?.(++done, src.length); }
    });
    if(repo !== forRepo) return map;
    refIndex = map; refIndexP = null;
    if(key){
      const paths = [...new Set([...map.values()].flatMap(s => [...s]))], idx = new Map(paths.map((p, i) => [p, i]));
      try{ for(let i = localStorage.length - 1; i >= 0; i--){ const k = localStorage.key(i); if(k?.startsWith('refs:') && k !== key) localStorage.removeItem(k); } }catch(e){}
      store.set(key, {p:paths, r:[...map].map(([g, s]) => [g, [...s].map(p => idx.get(p))])});
    }
    return map;
  })();
  return refIndexP;
}

/* ---- folder sizes: drill-down bar list (single series, value on every bar) ---- */
function renderSizes(){
  const body = $('infoBody');
  if(repo.kind === 'gl'){ body.innerHTML = `<p class="dnote">${esc(t('glNoSize'))}</p>`; return; }
  const pre = sizePath ? sizePath + '/' : '';
  const agg = new Map();
  for(const f of files){
    if(!f.path.startsWith(pre)) continue;
    const rest = f.path.slice(pre.length), k = rest.split('/')[0], dir = rest.includes('/');
    const e = agg.get(k) || {name:k, size:0, n:0, dir};
    e.size += f.size || 0; e.n++; e.dir = e.dir || dir; agg.set(k, e);
  }
  const items = [...agg.values()].sort((a, b) => b.size - a.size);
  const total = items.reduce((a, e) => a + e.size, 0);
  const top = items.slice(0, 15), rest = items.slice(15);
  if(rest.length) top.push({name:t('others', nf(rest.length)), size:rest.reduce((a, e) => a + e.size, 0), n:rest.reduce((a, e) => a + e.n, 0), dir:false, other:true});
  const max = Math.max(1, ...top.map(e => e.size));
  const parts = sizePath ? sizePath.split('/') : [];
  const crumbs = `<nav class="crumbs" aria-label="path"><button type="button" data-crumb="">${esc(t('sizesRoot'))}</button>`
    + parts.map((p, i) => `<span>/</span><button type="button" data-crumb="${esc(parts.slice(0, i + 1).join('/'))}">${safeHtml(p)}</button>`).join('') + `</nav>`;
  body.innerHTML = `<p class="dnote">${esc(t('sizesIntro'))} · ${esc(t('totalSize'))}: ${fmt(total)}</p>` + crumbs
    + `<div class="bars">${top.map(e => {
      const pct = total ? e.size / total * 100 : 0;
      const tip = `${plainName(e.name)} — ${fmt(e.size)} · ${pct.toFixed(1)}% · ${t('filesN', nf(e.n))}`;
      return `<button type="button" class="bar${e.dir ? ' dir' : ''}"${e.dir ? ` data-dir="${esc(pre + e.name)}"` : ' tabindex="-1"'} title="${esc(tip)}" aria-label="${esc(tip)}">
        <span class="bl">${e.dir ? '📁 ' : ''}${safeHtml(e.name)}</span><span class="bt"><span class="bf" style="width:${(e.size / max * 100).toFixed(2)}%"></span></span><span class="bv">${fmt(e.size)} · ${pct < 1 ? pct.toFixed(1) : Math.round(pct)}%</span></button>`;
    }).join('')}</div>`;
  const lfs = files.filter(f => f.path.startsWith(pre) && f.size > 0 && f.size < 200 && BIN.has(f.ext)).length;
  if(lfs) body.insertAdjacentHTML('beforeend', `<p class="dnote" style="margin-top:10px">${esc(t('lfsNote', nf(lfs)))}</p>`);
}

/* ---- editor scripts that run on their own ---- */
const EDITOR_RULES = [
  {k:'auto', re:/\[\s*(?:UnityEditor\.)?InitializeOnLoad(?:Attribute)?\s*[\](]/, label:'[InitializeOnLoad]'},
  {k:'auto', re:/\[\s*(?:UnityEditor\.)?InitializeOnLoadMethod(?:Attribute)?\s*[\](]/, label:'[InitializeOnLoadMethod]'},
  {k:'auto', re:/\[\s*(?:UnityEditor\.Callbacks\.)?DidReloadScripts\b/, label:'[DidReloadScripts]'},
  {k:'auto', re:/:\s*(?:UnityEditor\.)?AssetPostprocessor\b/, label:'AssetPostprocessor'},
  {k:'auto', re:/:\s*(?:UnityEditor\.)?AssetModificationProcessor\b/, label:'AssetModificationProcessor'},
  {k:'auto', re:/\bEditorApplication\.(?:update|delayCall|hierarchyChanged|projectChanged|playModeStateChanged)\s*\+?=/, label:'EditorApplication callback'},
  {k:'auto', re:/:\s*(?:UnityEditor\.AssetImporters\.)?ScriptedImporter\b/, label:'ScriptedImporter'},
  {k:'build', re:/\[\s*(?:UnityEditor\.Callbacks\.)?PostProcess(?:Build|Scene)\b/, label:'[PostProcessBuild]'},
  {k:'build', re:/\bI(?:Pre|Post)processBuild(?:WithReport)?\b|\bIProcessSceneWithReport\b/, label:'Build callback'},
  {k:'menu', re:/\[\s*(?:UnityEditor\.)?MenuItem\s*\(/, label:'[MenuItem]'},
  {k:'menu', re:/\[\s*(?:UnityEditor\.Callbacks\.)?OnOpenAsset\b/, label:'[OnOpenAsset]'},
  {k:'risk', re:/\bProcess\.Start\s*\(|\bnew\s+(?:System\.Diagnostics\.)?ProcessStartInfo\b/, label:'Process.Start'},
  {k:'risk', re:/\bnew\s+(?:System\.Net\.)?(?:WebClient|HttpClient|TcpClient|Socket)\b|\bWebRequest\.Create\b|\bUnityWebRequest\.(?:Get|Post|Put)\b/, label:'Network'},
  {k:'risk', re:/\b(?:File|Directory)\.Delete\s*\(|\bFileUtil\.Delete/, label:'Delete files'},
  {k:'risk', re:/\bFile\.WriteAllBytes\s*\(/, label:'File.WriteAllBytes'},
  {k:'risk', re:/\bAssembly\.Load(?:File|From)?\s*\(/, label:'Assembly.Load'},
  {k:'risk', re:/\[\s*DllImport\s*\(/, label:'[DllImport]'},
  {k:'risk', re:/\bMicrosoft\.Win32\.Registry\b|\bRegistry\.(?:CurrentUser|LocalMachine)\b/, label:'Registry'},
  {k:'risk', re:/\bConvert\.FromBase64String\s*\(/, label:'FromBase64String'},
];
const KIND_ORDER = {auto:0, build:1, risk:2, menu:3};
const kindLabel = k => t({auto:'kAuto', build:'kBuild', menu:'kMenu', risk:'kRisk'}[k]);
function scanCs(text){
  // blank out comments (keep line breaks) so matches point at real code
  const clean = text.replace(/\/\*[\s\S]*?\*\//g, m => m.replace(/[^\n]/g, ' ')).replace(/\/\/[^\n]*/g, '');
  const lines = clean.split('\n'), raw = text.split('\n'), hits = [];
  lines.forEach((l, i) => {
    for(const r of EDITOR_RULES) if(r.re.test(l)) hits.push({k:r.k, label:r.label, line:i + 1, code:(raw[i] || '').trim().slice(0, 220)});
  });
  return hits;
}
function renderEditor(){
  const body = $('infoBody');
  const legend = `<div class="legend">${['auto','build','risk','menu'].map(k => `<span><span class="badge b-${k}">${esc(kindLabel(k))}</span></span>`).join('')}</div>`;
  if(editorResult){
    const list = editorResult.filter(r => r.hits.length).sort((a, b) => Math.min(...a.hits.map(h => KIND_ORDER[h.k])) - Math.min(...b.hits.map(h => KIND_ORDER[h.k])) || a.f.path.localeCompare(b.f.path));
    body.innerHTML = `<p class="dnote">${esc(t('editorIntro'))} ${esc(t('editorNote'))}</p>` + legend + (list.length
      ? `<p class="dnote"><b style="color:var(--ink)">${esc(t('editorN', nf(list.length)))}</b></p>` + list.map(r => `<div class="finding"><button type="button" data-open="${esc(r.f.path)}">${safeHtml(r.f.path)}</button>`
        + r.hits.sort((a, b) => KIND_ORDER[a.k] - KIND_ORDER[b.k] || a.line - b.line).map(h => `<button type="button" class="hit" data-open="${esc(r.f.path)}" data-line="${h.line}"><span class="badge b-${h.k}">${esc(h.label)}</span><span class="ln-no">:${h.line}</span><code>${safeHtml(h.code)}</code></button>`).join('')
        + `</div>`).join('')
      : `<p>${esc(t('editorNone'))}</p>`);
    return;
  }
  body.innerHTML = `<p class="dnote">${esc(t('editorIntro'))}</p>${legend}<button class="btn primary" type="button" id="editorRun">${esc(t('editorRun'))}</button>`;
  $('editorRun').onclick = async () => {
    const tok = ++infoToken, src = files.filter(f => f.ext === 'cs' && !isSuspicious(f)).slice(0, 4000), out = [];
    let done = 0;
    const show = () => { if(tok === infoToken && infoTab === 'editor') body.innerHTML = progHtml(t('editorScanning', nf(done), nf(src.length)), done, src.length); };
    show();
    await pool(src, repo.kind === 'local' ? 12 : 24, async f => {
      try{ out.push({f, hits:scanCs(await readText(f.path))}); }
      finally{ done++; if(done % 10 === 0 || done === src.length) show(); }
    });
    if(tok !== infoToken) return;
    editorResult = out;
    if(infoTab === 'editor') renderEditor();
  };
}
