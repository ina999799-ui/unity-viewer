const sleep = (ms, signal) => new Promise((res, rej) => {
  const id = setTimeout(res, ms);
  signal?.addEventListener('abort', () => { clearTimeout(id); rej(new TErr('cancelled')); }, {once:true});
});
async function waitRate(secs, signal){
  for(let s = Math.max(1, Math.ceil(secs)); s > 0; s--){ sProg(t('sRate', s), 0, 0); await sleep(1000, signal); }
}
/* code search (10 requests/minute with a token): waits out the limit with a live countdown */
async function searchApi(q, page, perPage, textMatch){
  const signal = S.ctrl.signal;
  for(let tries = 0; ; tries++){
    if(S.rate && S.rate.rem === 0 && S.rate.reset * 1000 > Date.now()) await waitRate(S.rate.reset - Date.now() / 1000, signal);
    sProg(t('sSearching'), 0, 0);
    const url = `https://api.github.com/search/code?q=${encodeURIComponent(q)}&per_page=${perPage}&page=${page}`;
    const {r, buf} = await fetchWatched(url, {quiet:true, signal, headers:{Accept: textMatch ? 'application/vnd.github.text-match+json' : 'application/vnd.github+json', ...authHeaders()}});
    const rem = r.headers.get('x-ratelimit-remaining'), reset = +r.headers.get('x-ratelimit-reset');
    if(rem !== null) S.rate = {rem:+rem, reset};
    if(r.status === 401) throw new TErr('sTokenBad');
    if(r.status === 422) throw new TErr('sBadQuery');
    if((r.status === 403 || r.status === 429) && tries < 5){
      const ra = +r.headers.get('retry-after');
      await waitRate(ra || (reset ? reset - Date.now() / 1000 : 60), signal);
      continue;
    }
    if(!r.ok) throw new TErr('ghErr', r.status);
    return JSON.parse(td.decode(buf));
  }
}
const extOf = n => (n.match(/\.([^.\/]+)$/) || [])[1]?.toLowerCase() || '';
function candOf(item, assetPath){
  const path = assetPath ?? item.path, name = path.split('/').pop();
  const ref = (item.html_url.split('/blob/')[1] || '').split('/')[0] || 'HEAD';
  return {repo:item.repository.full_name, ref, path, name, ext:extOf(name), key:`${item.repository.full_name}:${path}`,
          frags:(item.text_matches || []).map(m => m.fragment || '')};
}
// Unity projects only (path inside Assets/), and the same name/program rules as the viewer
const okCand = c => /(^|\/)Assets\//.test(c.path) && !HIDDEN_RE.test(c.path) && !HIDDEN_RE.test(c.repo) && !EXEC_EXT.has(c.ext);
const rawOf = c => `https://raw.githubusercontent.com/${c.repo}/${c.ref}/${enc(c.path)}`;
const mediaOf = c => `https://media.githubusercontent.com/media/${c.repo}/${c.ref}/${enc(c.path)}`;
async function candBuffer(c, signal){
  let {r, buf} = await fetchWatched(rawOf(c), {quiet:true, signal, maxBytes:40 * 1048576});
  if(!r.ok) throw new Silent();
  if(buf.byteLength < 400 && td.decode(buf).startsWith('version https://git-lfs')){
    ({r, buf} = await fetchWatched(mediaOf(c), {quiet:true, signal, maxBytes:40 * 1048576}));
    if(!r.ok) throw new Silent();
  }
  if(sniff(buf, c.ext) !== 'ok') throw new Silent();       // same disguise / program checks as the viewer
  return buf;
}
const sha256 = async buf => [...new Uint8Array(await crypto.subtle.digest('SHA-256', buf))].map(b => b.toString(16).padStart(2, '0')).join('');
async function decodeImage(buf, ext){
  if(ext === 'tga'){
    const d = new TGALoader().parse(buf);
    const cv = document.createElement('canvas'); cv.width = d.width; cv.height = d.height;
    cv.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(d.data.buffer, d.data.byteOffset, d.width * d.height * 4), d.width, d.height), 0, 0);
    return cv;
  }
  return createImageBitmap(new Blob([buf]));
}
/* difference hash: 64 horizontal + 64 vertical gradient bits on a 9×9 grayscale thumbnail */
function dHash(src){
  const mid = document.createElement('canvas'); mid.width = mid.height = 64;
  const mx = mid.getContext('2d'); mx.fillStyle = '#808080'; mx.fillRect(0, 0, 64, 64); mx.imageSmoothingQuality = 'high'; mx.drawImage(src, 0, 0, 64, 64);
  const cv = document.createElement('canvas'); cv.width = cv.height = 9;
  const cx = cv.getContext('2d', {willReadFrequently:true}); cx.imageSmoothingQuality = 'high'; cx.drawImage(mid, 0, 0, 9, 9);
  const d = cx.getImageData(0, 0, 9, 9).data, g = (x, y) => { const i = (y * 9 + x) * 4; return d[i] * .299 + d[i+1] * .587 + d[i+2] * .114; };
  const bits = [];
  for(let y = 0; y < 8; y++) for(let x = 0; x < 8; x++) bits.push(g(x, y) < g(x + 1, y) ? 1 : 0);
  for(let y = 0; y < 8; y++) for(let x = 0; x < 8; x++) bits.push(g(x, y) < g(x, y + 1) ? 1 : 0);
  return bits;
}
const hashSim = (a, b) => { let s = 0; for(let i = 0; i < a.length; i++) if(a[i] === b[i]) s++; return s / a.length; };
function thumbOf(src){
  const k = Math.min(128 / src.width, 128 / src.height, 1);
  const cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(src.width * k)); cv.height = Math.max(1, Math.round(src.height * k));
  cv.getContext('2d').drawImage(src, 0, 0, cv.width, cv.height);
  return cv.toDataURL('image/png');
}
async function parseModelBuffer(buf, ext){
  const mgr = new THREE.LoadingManager();
  mgr.setURLModifier(u => /^(blob|data):/.test(u) ? u : BLANK_PNG);      // never fetch textures of candidates
  if(ext === 'fbx') return new FBXLoader(mgr).parse(buf, '');
  if(ext === 'obj') return new OBJLoader(mgr).parse(td.decode(buf));
  if(ext === 'glb' || ext === 'gltf') return (await parseP(new GLTFLoader(mgr), buf, '')).scene;
  throw new TErr('sBadFile');
}
function modelStats(obj){
  obj.updateMatrixWorld(true);
  let v = 0, tr = 0;
  obj.traverse(o => { if(o.isMesh){ const g = o.geometry, n = g.attributes.position?.count || 0; v += n; tr += (g.index ? g.index.count : n) / 3; } });
  const s = new THREE.Box3().setFromObject(obj).getSize(new THREE.Vector3());
  const dims = [s.x, s.y, s.z].sort((a, b) => b - a), m = dims[0] || 1;
  return {v, t:tr, dims:dims.map(d => d / m)};             // sorted proportions: independent of rotation and units
}
const ratio = (a, b) => (a || b) ? Math.min(a, b) / Math.max(a, b) : 1;
const modelSim = (a, b) => .35 * ratio(a.v, b.v) + .35 * ratio(a.t, b.t) + .3 * Math.max(0, 1 - (Math.abs(a.dims[1] - b.dims[1]) + Math.abs(a.dims[2] - b.dims[2])) / 2);
function lev(a, b){
  const m = a.length, n = b.length, d = Array.from({length:n + 1}, (_, j) => j);
  for(let i = 1; i <= m; i++){ let p = d[0]; d[0] = i; for(let j = 1; j <= n; j++){ const tmp = d[j]; d[j] = Math.min(d[j] + 1, d[j-1] + 1, p + (a[i-1] === b[j-1] ? 0 : 1)); p = tmp; } }
  return d[n];
}
const nameSim = (a, b) => { a = a.toLowerCase(); b = b.toLowerCase(); return a === b ? 1 : 1 - lev(a, b) / (Math.max(a.length, b.length) || 1); };
function codeSim(term, frags){
  if(!frags.length) return .9;
  if(frags.some(f => f.includes(term))) return 1;
  const lt = term.toLowerCase();
  if(frags.some(f => f.toLowerCase().includes(lt))) return .95;
  const words = lt.split(/\s+/).filter(Boolean), all = frags.join(' ').toLowerCase();
  return .9 * words.filter(w => all.includes(w)).length / (words.length || 1);
}
function bestFrag(term, frags){
  const lt = term.toLowerCase(), f = frags.find(x => x.toLowerCase().includes(lt)) || frags[0] || '';
  let i = Math.max(0, f.toLowerCase().indexOf(lt) - 50);
  if(i > 0){ const sp = f.slice(i).search(/\s/); if(sp >= 0 && sp < 20) i += sp + 1; }   // start on a word boundary
  return (i > 0 ? '… ' : '') + f.slice(i, i + 160).replace(/\s+/g, ' ').trim();
}
function pick(list, want, random){
  if(random) for(let i = list.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [list[i], list[j]] = [list[j], list[i]]; }
  else list.sort((a, b) => b.score - a.score);
  return list.slice(0, want);
}
/* name / code search: one or more result pages, scored and filtered by the similarity bar */
async function textSearch(q, scoreFn, want, thr, random, textMatch){
  const seen = seenGet(), keys = new Set(), out = [];
  let page = 1;
  for(let req = 0; req < 3 && out.length < want * (random ? 3 : 1); req++){
    const j = await searchApi(q, page, 50, textMatch);
    for(const it of j.items || []){
      const c = candOf(it);
      if(!okCand(c) || keys.has(c.key)) continue;
      keys.add(c.key);
      if(seen.has(c.key)){ S.hidden++; continue; }
      c.score = scoreFn(c);
      if(c.score >= thr) out.push(c);
    }
    const maxPage = Math.ceil(Math.min(j.total_count || 0, 1000) / 50);
    if(maxPage <= 1) break;
    page = random ? 1 + Math.floor(Math.random() * Math.min(maxPage, 20)) : page + 1;
    if(!random && page > maxPage) break;
  }
  return pick(out, want, random);
}
/* image / model candidates: GitHub doesn't index binary files, but Unity's .meta files are text,
   so search TextureImporter / ModelImporter metas (Unity projects only) and take their asset */
async function metaCandidates(kind, hintName, cap, random){
  const exts = kind === 'img' ? ['png','jpg','jpeg','tga'] : ['fbx','obj','glb'];
  const importer = kind === 'img' ? 'TextureImporter' : 'ModelImporter';
  const seen = seenGet(), keys = new Set(), out = [];
  const queries = [];
  const hint = String(hintName || '').replace(/["\s\\]+/g, '');
  if(hint) queries.push([`filename:${hint}.meta path:Assets`, 1]);
  queries.push([`${importer} extension:meta path:Assets`, random ? 1 + Math.floor(Math.random() * 10) : 1]);
  if(!random) queries.push([`${importer} extension:meta path:Assets`, 2]);
  for(const [q, page] of queries){
    if(out.length >= cap) break;
    let j;
    try{ j = await searchApi(q, page, 100); }catch(e){ if(e?.k?.[0] === 'sBadQuery') continue; throw e; }
    for(const it of j.items || []){
      if(!it.path.endsWith('.meta')) continue;
      const c = candOf(it, it.path.slice(0, -5));
      if(!exts.includes(c.ext) || !okCand(c) || keys.has(c.key)) continue;
      keys.add(c.key);
      if(seen.has(c.key)){ S.hidden++; continue; }
      out.push(c);
      if(out.length >= cap) break;
    }
  }
  return out;
}
async function compareAll(cands, measure){
  const signal = S.ctrl.signal, out = [];
  let done = 0;
  S.scanned = cands.length;
  sProg(t('sFetching', 0, cands.length), 0, cands.length);
  await pool(cands, 4, async c => {
    try{ const res = await measure(c); if(res) out.push(res); }        // failed / unsafe candidates drop out silently
    finally{ done++; if(!signal.aborted) sProg(t('sFetching', done, cands.length), done, cands.length); }
  });
  if(signal.aborted) throw new TErr('cancelled');
  return out;
}
async function imageSearch(file, want, thr, random){
  const buf = await file.arrayBuffer(), ext = extOf(file.name);
  if(!['png','jpg','jpeg','tga'].includes(ext) || HIDDEN_RE.test(file.name) || sniff(buf, ext) !== 'ok') throw new TErr('sBadFile');
  const [sha, src] = await Promise.all([sha256(buf), decodeImage(buf, ext)]);
  const mine = dHash(src);
  const cands = await metaCandidates('img', file.name, Math.min(60, Math.max(want * 6, 24)), random);
  const scored = await compareAll(cands, async c => {
    const b = await candBuffer(c, S.ctrl.signal);
    const exact = await sha256(b) === sha;
    const img = await decodeImage(b, c.ext);
    const sim = exact ? 1 : Math.min(.99, hashSim(mine, dHash(img)));
    if(sim < thr) return null;
    Object.assign(c, {score:sim, exact, thumb:thumbOf(img), extra:`${img.width}×${img.height}`});
    return c;
  });
  return pick(scored, want, random);
}
async function modelSearch(file, want, thr, random){
  const buf = await file.arrayBuffer(), ext = extOf(file.name);
  if(!['fbx','obj','glb'].includes(ext) || HIDDEN_RE.test(file.name) || sniff(buf, ext) !== 'ok') throw new TErr('sBadFile');
  const sha = await sha256(buf);
  const mineObj = await parseModelBuffer(buf, ext), mine = modelStats(mineObj); disposeObj(mineObj);
  const cands = await metaCandidates('model', file.name, Math.min(40, Math.max(want * 5, 16)), random);
  const scored = await compareAll(cands, async c => {
    const b = await candBuffer(c, S.ctrl.signal);
    const exact = await sha256(b) === sha;
    const obj = await parseModelBuffer(b, c.ext), st = modelStats(obj);
    const sim = exact ? 1 : Math.min(.99, modelSim(mine, st));
    if(sim < thr){ disposeObj(obj); return null; }
    Object.assign(c, {score:sim, exact, thumb:renderThumb(obj), extra:`${nf(st.v)} · ${nf(st.t)}△`});
    disposeObj(obj);
    return c;
  });
  return pick(scored, want, random);
}
/* thumbnails for name/code results that are images or models (also re-checks them for safety) */
async function addThumbs(list){
  const todo = list.filter(c => VIEWIMG.includes(c.ext) || c.ext === 'tga' || ['fbx','obj','glb'].includes(c.ext));
  const bad = new Set(); let done = 0;
  if(todo.length) sProg(t('sThumbs', 0, todo.length), 0, todo.length);
  await pool(todo, 4, async c => {
    try{
      const b = await candBuffer(c, S.ctrl.signal);
      if(c.ext === 'fbx' || c.ext === 'obj' || c.ext === 'glb'){ const o = await parseModelBuffer(b, c.ext); c.thumb = renderThumb(o); disposeObj(o); }
      else c.thumb = thumbOf(await decodeImage(b, c.ext));
    }catch(e){ if(e instanceof Silent) bad.add(c); }
    finally{ done++; sProg(t('sThumbs', done, todo.length), done, todo.length); }
  });
  if(S.ctrl.signal.aborted) throw new TErr('cancelled');
  return list.filter(c => !bad.has(c));
}
function renderResults(list){
  S.results = list;
  $('sResults').innerHTML = list.map((c, i) => {
    const cls = (catOf(extCat[c.ext] || 'other') || {cls:'cother'}).cls, pct = Math.round(c.score * 100);
    return `<button type="button" class="sres" data-i="${i}" title="${esc(plainName(c.repo + ' / ' + c.path))}">
      <span class="sth ${c.thumb ? '' : cls}">${c.thumb ? `<img alt="" src="${esc(c.thumb)}">` : esc(plainName(c.ext || '—').slice(0, 8))}</span>
      <span class="sinfo"><b>${safeHtml(c.name)}</b><small>${safeHtml(c.repo)}</small><small>${safeHtml(c.path)}${c.extra ? ' · ' + esc(c.extra) : ''}</small>${c.frag ? `<code>${safeHtml(c.frag)}</code>` : ''}</span>
      <span class="sscore${c.exact ? ' exact' : ''}"${c.exact ? ` title="${esc(t('sExact'))}"` : ''}><bdi dir="ltr">${pct}%</bdi></span></button>`;
  }).join('');
}
$('sResults').addEventListener('click', e => {
  const b = e.target.closest('.sres'); if(!b) return;
  const c = S.results[+b.dataset.i]; if(!c) return;
  $('searchDlg').close();
  pendingOpen = {key:c.repo.toLowerCase(), path:c.path};
  $('url').value = `https://github.com/${c.repo}`;
  loadRepo(`https://github.com/${c.repo}/tree/${c.ref}`);       // the exact commit the result came from
});
async function runSearch(){
  if(!tokenGet()){ $('tokBox').open = true; $('tokIn').focus(); sStatusText(t('sNeedToken'), true); return; }
  S.ctrl?.abort();
  const ctrl = S.ctrl = new AbortController();
  const want = Math.max(1, Math.min(30, Math.round(+$('sCountIn').value || 6))); $('sCountIn').value = want;
  const thr = +$('sMinR').value / 100, random = S.random;
  S.hidden = 0; S.scanned = 0;
  $('sGo').disabled = true; $('sResults').innerHTML = ''; sStatusText('');
  try{
    let list;
    if(S.mode === 'name' || S.mode === 'code'){
      const term = $('sq').value.trim().replace(/["\\]/g, '');
      if(!term){ $('sq').focus(); return; }
      if(S.mode === 'name') list = await textSearch(`filename:${term.replace(/\s+/g, '')} path:Assets`, c => nameSim(term, c.name), want, thr, random, false);
      else{
        list = await textSearch(`${/\s/.test(term) ? `"${term}"` : term} path:Assets extension:cs`, c => codeSim(term, c.frags), want, thr, random, true);
        list.forEach(c => c.frag = bestFrag(term, c.frags));
      }
      list = await addThumbs(list);
    }else{
      if(!S.file || S.fileMode !== S.mode){ $('sFileBtn').focus(); sStatusText(t(S.mode === 'img' ? 'sPickImg' : 'sPickModel'), true); return; }
      list = S.mode === 'img' ? await imageSearch(S.file, want, thr, random) : await modelSearch(S.file, want, thr, random);
    }
    if(ctrl.signal.aborted) throw new TErr('cancelled');
    seenAdd(list.map(c => c.key));
    renderResults(list);
    sStatusText(list.length
      ? [t('sFound', nf(list.length)), S.scanned ? t('sScanned', nf(S.scanned)) : '', S.hidden ? t('sSeen', nf(S.hidden)) : ''].filter(Boolean).join(' · ')
      : t('sNone') + (S.hidden ? ' · ' + t('sSeen', nf(S.hidden)) : ''));
  }catch(e){
    if(S.ctrl === ctrl) sStatusText(e?.k?.[0] === 'cancelled' ? t('sCancelled') : tx(errText(e)), e?.k?.[0] !== 'cancelled');
  }finally{
    if(S.ctrl === ctrl){ $('sGo').disabled = false; $('sProg').hidden = true; }
  }
}

applyLang();

}
